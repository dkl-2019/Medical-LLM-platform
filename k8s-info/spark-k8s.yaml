# Spark 3.5.4 Standalone 集群部署
# 架构：master 部署在 144（ubuntn144），worker 分别部署在 144 和 145
# Web UI：http://10.131.102.144:32080
---
apiVersion: v1
kind: Namespace
metadata:
  name: spark
---
# Spark Master：集群主控服务，调度资源、提供 Web UI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: spark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      # 关闭 service 环境变量自动注入，避免 SPARK_MASTER_PORT=tcp://... 与 Spark 同名配置冲突
      enableServiceLinks: false
      # 固定调度到 144 主节点
      nodeSelector:
        kubernetes.io/hostname: ubuntn144
      containers:
        - name: spark-master
          image: docker.io/apache/spark:3.5.4
          imagePullPolicy: IfNotPresent
          # apache/spark 镜像入口只支持 k8s 原生模式，standalone 需直接调 spark-class 启动 Master
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "0.0.0.0", "--webui-port", "8080"]
          ports:
            - containerPort: 7077   # RPC 通信端口，worker 与 driver 通过该端口连接 master
            - containerPort: 8080   # Web UI 端口
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "500m"
              memory: 1Gi
---
# Spark Master Service：
# - 7077 走 ClusterIP，worker 通过集群内 DNS 连接
# - 8080 Web UI 走 NodePort 32080，供外部浏览器访问
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: spark
spec:
  type: NodePort
  selector:
    app: spark-master
  ports:
    - name: rpc
      port: 7077
      targetPort: 7077
    - name: ui
      port: 8080
      targetPort: 8080
      nodePort: 32080
---
# Spark Worker 1：部署在 144
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker-144
  namespace: spark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker-144
  template:
    metadata:
      labels:
        app: spark-worker-144
    spec:
      # 关闭 service 环境变量自动注入，避免与 Spark 同名配置冲突
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: ubuntn144
      containers:
        - name: spark-worker
          image: docker.io/apache/spark:3.5.4
          imagePullPolicy: IfNotPresent
          # 直接调 spark-class 启动 Worker，注册到 master
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master.spark.svc.cluster.local:7077", "--webui-port", "8081"]
          ports:
            - containerPort: 8081   # worker Web UI 端口
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "500m"
              memory: 1Gi
---
# Spark Worker 2：部署在 145
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker-145
  namespace: spark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker-145
  template:
    metadata:
      labels:
        app: spark-worker-145
    spec:
      # 关闭 service 环境变量自动注入，避免与 Spark 同名配置冲突
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: ubuntn145
      containers:
        - name: spark-worker
          image: docker.io/apache/spark:3.5.4
          imagePullPolicy: IfNotPresent
          # 直接调 spark-class 启动 Worker，注册到 master
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master.spark.svc.cluster.local:7077", "--webui-port", "8081"]
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "500m"
              memory: 1Gi
